[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfern"
version = "1.0.0"
description = "Hierarchical Predictive Coding with Multi-Head Vector Linear Attention"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "luadotq" }
]
keywords = [
    "deep-learning",
    "linear-attention",
    "predictive-coding",
    "nlp",
    "transformers",
    "jax",
    "triton",
    "deepspeed"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "tokenizers>=0.15.0",
    "safetensors>=0.4.0",
    "numpy>=1.22.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "flax>=0.7.0",
    "optax>=0.1.7",
]
triton = [
    "triton>=2.1.0",
]
deepspeed = [
    "deepspeed>=0.12.0",
]
all = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "flax>=0.7.0",
    "optax>=0.1.7",
    "triton>=2.1.0",
    "deepspeed>=0.12.0",
]

[project.scripts]
pyfern = "pyFERN.cli:main"

[project.urls]
Homepage = "https://github.com/luadotq/FERN"
Documentation = "https://github.com/luadotq/FERN/blob/main/README.md"
Repository = "https://github.com/luadotq/FERN.git"

[tool.setuptools.packages.find]
include = ["pyFERN*"]
